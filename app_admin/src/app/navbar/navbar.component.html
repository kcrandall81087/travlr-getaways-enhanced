<nav class="navbar navbar-expand-lg navbar-light app-navbar">
  <div class="container">
    <a
      class="navbar-brand"
      routerLink=""
      aria-label="Travlr Getaways home">
      <img
        src="/assets/images/logo.png"
        alt="Travlr Getaways">
    </a>

    <button
      class="navbar-toggler"
      type="button"
      aria-controls="navbarNavigation"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation"
      (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      id="navbarNavigation"
      class="collapse navbar-collapse"
      [ngClass]="{ 'show': isMenuOpen }">

      <div class="navbar-nav mr-auto">
        <a
          class="nav-link"
          routerLink=""
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
          Trips
        </a>
      </div>

      <div class="navbar-actions">
        <a
          *ngIf="!isLoggedIn()"
          class="nav-link"
          routerLink="login"
          routerLinkActive="active">
          Log In
        </a>

        <button
          *ngIf="isLoggedIn()"
          type="button"
          class="btn btn-outline-secondary btn-sm"
          (click)="onLogout()">
          Log Out
        </button>
      </div>
    </div>
  </div>
</nav>
